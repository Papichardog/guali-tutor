# Conexión con la API REST de Guali Tutor (guali-tutor-api).
# La comunicación es siempre por HTTPS: una URL que no empiece por https:// se rechaza al arrancar.

# URL base de la API (sin barra final).
api.baseUrl=https://localhost:8443

# Certificado de la API en el que el cliente confía. La API usa un certificado autofirmado de desarrollo, así que
# el cliente solo acepta ESTE certificado. Es el mismo guali-dev.crt que exportó el proyecto guali-tutor-api.
#   classpath:certs/guali-dev.crt          -> dentro de la aplicación (src/main/resources/certs/guali-dev.crt)
#   file:/ruta/absoluta/guali-dev.crt      -> un archivo en disco
api.certificado=classpath:certs/guali-dev.crt

# Tiempos máximos, en segundos: para establecer la conexión y para esperar la respuesta.
api.timeoutConexionSegundos=5
api.timeoutRespuestaSegundos=60
